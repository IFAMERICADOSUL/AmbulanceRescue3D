
name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    tags: ["v*"]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configura Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Installa componenti Android richiesti
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Verifica progetto
        run: |
          echo "Versione Godot:"
          godot --version
          echo "Contenuto progetto:"
          ls -la

      - name: Installa template ed esporta APK
        run: |
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-debug "Android" build/FrontieraSelvaggia.apk

      - name: Verifica APK
        run: |
          test -f build/FrontieraSelvaggia.apk
          ls -lh build/FrontieraSelvaggia.apk

      - name: Pubblica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frontiera-Selvaggia-Android
          path: build/FrontieraSelvaggia.apk
          if-no-files-found: error
          retention-days: 30
